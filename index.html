<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Study Hub — Welcome</title>
  <link rel="stylesheet" href="index.css">

<body>

      </div>
 
      <div class="cta-row">
        <a href="signup.html" class="btn-primary">Get Started →</a>
