<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hub — Sign In</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
 
  <!-- Bouncing background -->
  <div class="box-wave" aria-hidden="true">
    <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span>
    <span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span>
    <span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span>
    <span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span>
    <span style="--i:12"></span><span style="--i:13"></span><span style="--i:14"></span>
    <span style="--i:15"></span><span style="--i:16"></span><span style="--i:17"></span>
  </div>
 
  <main class="page">
    <div class="auth-card">
 
      <div class="form-logo">📚</div>
      <h1>Welcome back</h1>
      <p class="form-sub">Sign in to continue your study journey</p>
 
      <form id="signinForm" novalidate>
 
        <div class="field-group">
          <label for="si-email">Email</label>
          <input type="email" id="si-email" placeholder="student@school.com" required>
          <span class="field-error" id="si-email-err"></span>
        </div>
 
        <div class="field-group">
          <label for="si-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="si-password" placeholder="Your password" required>
            <button type="button" class="eye-btn" data-target="si-password">👁</button>
          </div>
          <span class="field-error" id="si-password-err"></span>
        </div>
 
        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
 
        <p class="form-message" id="si-message"></p>
 
        <button type="submit" class="submit-btn" id="signinBtn">Sign In →</button>
 
        <div class="divider"><span>or continue with</span></div>
        <div class="social-row">
          <button type="button" class="social-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button type="button" class="social-btn">🍎 Apple</button>
        </div>
 
        <p class="switch-link">Don't have an account? <a href="signup.html">Create one</a></p>
        <p class="back-link"><a href="index.html">← Back to home</a></p>
 
      </form>
    </div>
  </main>
 
  <script src="login.js"></script>
</body>
</html>
