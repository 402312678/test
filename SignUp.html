<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hub — Create Account</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
 
  <!-- Bouncing background -->
  <div class="box-wave" aria-hidden="true">
    <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span>
    <span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span>
    <span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span>
    <span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span>
    <span style="--i:12"></span><span style="--i:13"></span><span style="--i:14"></span>
    <span style="--i:15"></span><span style="--i:16"></span><span style="--i:17"></span>
  </div>
 
  <main class="page">
    <div class="auth-card">
 
      <div class="form-logo">🎓</div>
      <h1>Create account</h1>
      <p class="form-sub">Join Study Hub and start learning smarter</p>
 
      <form id="signupForm" novalidate>
 
        <div class="field-row">
          <div class="field-group">
            <label for="su-name">First Name</label>
            <input type="text" id="su-name" placeholder="Alex" required>
            <span class="field-error" id="su-name-err"></span>
          </div>
          <div class="field-group">
            <label for="su-surname">Surname</label>
            <input type="text" id="su-surname" placeholder="Smith" required>
            <span class="field-error" id="su-surname-err"></span>
          </div>
        </div>
 
        <div class="field-group">
          <label for="su-email">Email</label>
          <input type="email" id="su-email" placeholder="student@school.com" required>
          <span class="field-error" id="su-email-err"></span>
        </div>
 
        <div class="field-group">
          <label for="su-number">Phone Number</label>
          <input type="tel" id="su-number" placeholder="0712345678" maxlength="10" required>
          <span class="field-error" id="su-number-err"></span>
        </div>
 
        <div class="field-group">
          <label for="su-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="su-password" placeholder="Min. 8 characters" required>
            <button type="button" class="eye-btn" data-target="su-password">👁</button>
          </div>
          <div class="password-strength" id="pwStrength"></div>
          <span class="field-error" id="su-password-err"></span>
        </div>
 
        <div class="field-group">
          <label for="su-confirm">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="su-confirm" placeholder="Repeat password" required>
            <button type="button" class="eye-btn" data-target="su-confirm">👁</button>
          </div>
          <span class="field-error" id="su-confirm-err"></span>
        </div>
 
        <p class="form-message" id="su-message"></p>
 
        <button type="submit" class="submit-btn">Create Account →</button>
 
        <div class="divider"><span>or continue with</span></div>
        <div class="social-row">
          <button type="button" class="social-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button class="oauthButton">
                    <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path>
        </svg>
                    Continue with Github
                </button>
        </div>
 
        <p class="switch-link">Already have an account? <a href="login.html">Sign in</a></p>
        <p class="back-link"><a href="index.html">← Back to home</a></p>
 
      </form>
    </div>
  </main>
 
  <script src="SignUp.js"></script>
</body>
</html>
